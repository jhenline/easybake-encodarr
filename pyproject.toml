[project]
name = "easybake-encodarr"
version = "0.1.0"
description = "EasyBake Encodarr — scan folders and re-encode videos to HEVC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "watchdog>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
easybake = "hevc_encoder.cli:app"
hevc-encoder = "hevc_encoder.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hevc_encoder*"]

[tool.setuptools.package-data]
hevc_encoder = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
